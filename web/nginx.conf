server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Propaganda uploads (API allows up to 12 MB)
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker DNS: resolve api/media at request time so nginx starts even if they are down
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $media_upstream http://media:8001;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Clip video preview/download use Range requests
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /media/ {
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass $media_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Live MPEG-TS is an endless response: stream it through unbuffered
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header Cache-Control "no-store" always;
    }

    # Vite assets have content hashes in their names
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routes (/historico, /quadras, …)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
